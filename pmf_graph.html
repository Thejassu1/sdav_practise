<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binomial Distribution PMF Visualizer</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://jsdelivr.net"></script>
    <!-- Chart.js for rendering the bar chart -->
    <script src="https://jsdelivr.net"></script>
    <!-- Chart.js Annotation Plugin for the vertical mean reference line -->
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="bg-white p-6 rounded-2xl shadow-lg w-full max-w-4xl border border-slate-100">
        <h1 class="text-2xl font-bold text-slate-900 mb-6 text-center">Binomial Distribution PMF Visualizer</h1>
        
        <!-- Controls Section -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6 bg-slate-50 p-4 rounded-xl border border-slate-200">
            <div>
                <label for="inputN" class="block text-sm font-semibold text-slate-700 mb-1">Number of Trials (n):</label>
                <input type="number" id="inputN" value="20" min="1" max="500" step="1" 
                       class="w-full px-3 py-2 bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div>
                <label for="inputP" class="block text-sm font-semibold text-slate-700 mb-1">Probability of Success (p):</label>
                <input type="number" id="inputP" value="0.5" min="0" max="1" step="0.01" 
                       class="w-full px-3 py-2 bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            </div>
        </div>

        <!-- Chart Container -->
        <div class="relative h-96 w-full">
            <canvas id="pmfChart"></canvas>
        </div>
    </div>

    <script>
        const inputN = document.getElementById('inputN');
        const inputP = document.getElementById('inputP');
        const ctx = document.getElementById('pmfChart').getContext('2d');
        let chartInstance = null;

        // Logarithm-based factorial cache to safely calculate combinations without overflow
        function logFactorial(num) {
            let logFact = 0;
            for (let i = 1; i <= num; i++) {
                logFact += Math.log(i);
            }
            return logFact;
        }

        // Exact PMF calculation using logs for high-precision stability
        function binomialPMF(k, n, p) {
            if (p === 0) return k === 0 ? 1 : 0;
            if (p === 1) return k === n ? 1 : 0;
            if (k < 0 || k > n) return 0;
            
            const logBinomialCoeff = logFactorial(n) - logFactorial(k) - logFactorial(n - k);
            const logProb = logBinomialCoeff + (k * Math.log(p)) + ((n - k) * Math.log(1 - p));
            return Math.exp(logProb);
        }

        // Render loop
        function updateChart() {
            let n = parseInt(inputN.value);
            let p = parseFloat(inputP.value);

            // Sanitise inputs safely
            if (isNaN(n) || n < 1) n = 1;
            if (n > 500) n = 500; 
            if (isNaN(p) || p < 0) p = 0;
            if (p > 1) p = 1;

            const labels = [];
            const dataPoints = [];
            
            for (let x = 0; x <= n; x++) {
                labels.push(x);
                dataPoints.push(binomialPMF(x, n, p));
            }

            const mean = n * p;

            if (chartInstance) {
                chartInstance.destroy();
            }

            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        data: dataPoints,
                        backgroundColor: 'rgba(59, 130, 246, 0.75)',
                        borderColor: 'rgb(37, 99, 235)',
                        borderWidth: 1,
                        borderRadius: 4,
                        barPercentage: 0.95
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: {
                            title: {
                                display: true,
                                text: 'Number of Successes X',
                                font: { weight: 'bold' }
                            },
                            grid: { display: false }
                        },
                        y: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: 'Probability P(X)',
                                font: { weight: 'bold' }
                            }
                        }
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                title: function(context) {
                                    return `X = ${context[0].label}`;
                                },
                                label: function(context) {
                                    return `P(X=${context.label}) = ${context.parsed.y.toFixed(5)}`;
                                }
                            }
                        },
                        annotation: {
                            annotations: {
                                meanLine: {
                                    type: 'line',
                                    xMin: mean,
                                    xMax: mean,
                                    borderColor: 'rgb(220, 38, 38)',
                                    borderWidth: 2,
                                    borderDash:,
                                    label: {
                                        display: true,
                                        content: `Mean (μ) = ${mean.toFixed(2)}`,
                                        position: 'start',
                                        backgroundColor: 'rgba(220, 38, 38, 0.9)',
                                        font: { size: 11, weight: 'bold' }
                                    }
                                }
                            }
                        }
                    }
                }
            });
        }

        // Hook reactive updates
        inputN.addEventListener('input', updateChart);
        inputP.addEventListener('input', updateChart);

        // Run initial render
        updateChart();
    </script>
</body>
</html>
